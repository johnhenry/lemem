name: Publish to npm

on:
  release:
    types: [published]
  push:
    # Redundant with the release trigger above -- see fileable's
    # publish.yml / johnhenry/workflows' README for the full incident
    # writeup: creating a release very soon after a push/merge to the
    # same commit can silently drop the release event for a job whose
    # body is uses: <external-repo>/...@v1. This gives a second,
    # idempotency-safe chance to fire.
    tags:
      - "v*"
  workflow_dispatch: {}

# Releases fire twice: `release: published`, and the tag push it creates.
# Queue the second run (never cancel it) so its `npm view` guard sees the
# version the first one published and exits cleanly, instead of both runs
# publishing at once and one failing (E403/E409). This is not the CI
# concurrency-cancel block: publish runs must never be cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Publish
        # Idempotent: `npm view` exits non-zero for a version that isn't on
        # the registry yet, which is the signal to publish.
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already published::$PKG_NAME@$PKG_VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
